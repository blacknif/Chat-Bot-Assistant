<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Chatbot Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f0f11;
      --surface: #18181c;
      --surface2: #222228;
      --border: rgba(255, 255, 255, 0.07);
      --text: #e8e8f0;
      --muted: #7b7b90;
      --author: #d9ff52;
      --accent: #7c6ff7;
      --accent-glow: rgba(124, 111, 247, 0.15);
      --user-bubble: #7c6ff7;
      --ai-bubble: #222228;
      --radius: 18px;
      --font: 'DM Sans', sans-serif;
      --mono: 'DM Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .logo-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    header h1 {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.2px;
    }

    .author-badge {
      margin-left: auto;
      font-size: 12px;
      color: var(--author);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 10px;
      font-family: var(--mono);
    }

    #memory-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      padding: 5px 10px;
      font-size: 12px;
      font-family: var(--mono);
      transition: 0.2s;
    }

    #memory-toggle.active {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Clear chat button */
    #clear-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      padding: 5px 10px;
      font-size: 12px;
      font-family: var(--mono);
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.15s, border-color 0.15s;
      margin-left: 8px;
    }

    #clear-btn:hover {
      color: #ff6b6b;
      border-color: rgba(255, 107, 107, 0.4);
    }

    #chat-container {
      width: 100%;
      max-width: 720px;
      flex: 1;
      overflow-y: auto;
      padding: 90px 20px 140px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface2) transparent;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg.ai {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.65;
      font-size: 15px;
    }

    .msg.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .msg.ai .bubble {
      background: var(--ai-bubble);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }

    .msg-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      font-family: var(--mono);
      letter-spacing: 0.3px;
    }

    /* Message action buttons row */
    .msg-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .msg:hover .msg-actions {
      opacity: 1;
    }

    .action-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-family: var(--mono);
      padding: 4px 9px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .action-btn:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
    }

    .action-btn.copied {
      color: #4ade80;
      border-color: rgba(74, 222, 128, 0.3);
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 18px;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-6px);
      }
    }

    #input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, var(--bg) 80%, transparent);
      padding: 16px 20px 24px;
      display: flex;
      justify-content: center;
    }

    #input-row {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 12px 10px 18px;
      transition: border-color 0.2s;
    }

    #input-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      max-height: 140px;
      min-height: 24px;
    }

    #user-input::placeholder {
      color: var(--muted);
    }

    #send-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
    }

    #send-btn:hover {
      opacity: 0.85;
    }

    #send-btn:active {
      transform: scale(0.95);
    }

    #send-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #send-btn svg {
      width: 16px;
      height: 16px;
      fill: #fff;
    }

    code {
      font-family: var(--mono);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 13px;
      color: #c4bfff;
    }

    .bubble {
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .bubble p {
      margin-bottom: 12px;
    }

    .bubble p:last-child {
      margin-bottom: 0;
    }

    .bubble ul,
    .bubble ol {
      padding-left: 22px;
      margin: 10px 0;
    }

    .bubble li {
      margin-bottom: 6px;
    }

    .bubble pre {
      background: #111114;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      overflow-x: auto;
      margin-top: 12px;
    }

    .bubble pre code {
      background: none;
      padding: 0;
      color: #d6d6ff;
      font-size: 13px;
      line-height: 1.6;
    }

    .bubble h1,
    .bubble h2,
    .bubble h3 {
      margin: 14px 0 10px;
      line-height: 1.3;
    }

    .bubble strong {
      color: #fff;
    }

    .bubble a {
      color: #9b8cff;
      text-decoration: none;
    }

    .bubble a:hover {
      text-decoration: underline;
    }

    .bubble blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin: 12px 0;
      color: #b7b7c9;
    }

    /* Empty state */
    .empty-state {
      margin: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--muted);
    }

    .empty-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .empty-state h2 {
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
    }

    .empty-state p {
      font-size: 14px;
      max-width: 300px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .suggestion-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .suggestion-chip:hover {
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    /* Clear chat confirm toast */
    #toast {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 13px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: all;
    }

    #toast button {
      background: #ff6b6b;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      font-family: var(--mono);
      padding: 3px 8px;
    }

    #toast .cancel-toast {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
    }
  </style>
</head>

<body>

  <header>
    <div class="logo-dot">✦</div>
    <h1>AI Chat</h1>
    <span class="author-badge">Made by Jovan Yeo Kaisheng</span>
    <button id="memory-toggle" onclick="toggleMemory()">
      Memory: ON
    </button>
    <button id="clear-btn" onclick="promptClear()" title="Clear chat">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6l-1 14H6L5 6" />
        <path d="M10 11v6" />
        <path d="M14 11v6" />
        <path d="M9 6V4h6v2" />
      </svg>
      Clear
    </button>
  </header>

  <!-- Confirm clear toast -->
  <div id="toast">
    Clear all messages?
    <button onclick="clearChat()">Yes, clear</button>
    <button class="cancel-toast" onclick="hideToast()">Cancel</button>
  </div>

  <div id="chat-container">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">✦</div>
      <h2>How can I help you?</h2>
      <p>Powered by Google Gemini. Ask me anything.</p>
      <div class="suggestions">
        <button class="suggestion-chip" onclick="sendSuggestion(this)">Explain quantum computing</button>
        <button class="suggestion-chip" onclick="sendSuggestion(this)">Write a short poem</button>
        <button class="suggestion-chip" onclick="sendSuggestion(this)">Help me brainstorm ideas</button>
        <button class="suggestion-chip" onclick="sendSuggestion(this)">Teach me the ways to prompt correctly</button>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="user-input" placeholder="Message AI..." rows="1"></textarea>
      <button id="send-btn" onclick="sendMessage()" aria-label="Send">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    //localStorage.removeItem("chatHistory");
    const API_URL = "/chat";
    const STORAGE_KEY = "chatHistory";
    const SHOULD_PERSIST = true;
    const chatContainer = document.getElementById("chat-container");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    let emptyState = document.getElementById("empty-state");
    let messageIdCounter = 0;
    let conversationHistory = [];
    let memoryEnabled = true;

    const savedMemoryState = localStorage.getItem("memoryEnabled");
    if (savedMemoryState !== null) {
      memoryEnabled = savedMemoryState === "true";
    }
    const MAX_HISTORY = 20;

    function trimHistory() {
      if (conversationHistory.length > MAX_HISTORY) {
        conversationHistory = conversationHistory.slice(-MAX_HISTORY);
      }
    }

    // ── LocalStorage helpers ──────────────────────────────────────────
    function saveHistory() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(conversationHistory));
    }

    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch { return []; }
    }

    // ── Restore saved messages on load ───────────────────────────────
    conversationHistory = SHOULD_PERSIST ? loadHistory() : [];

    const memoryBtn = document.getElementById("memory-toggle");

    if (memoryEnabled) {
      memoryBtn.textContent = "Memory: ON";
      memoryBtn.classList.add("active");
    } else {
      memoryBtn.textContent = "Memory: OFF";
      memoryBtn.classList.remove("active");
    }
    if (!SHOULD_PERSIST) {
      localStorage.removeItem(STORAGE_KEY);
    }
    if (conversationHistory.length > 0) {
      if (emptyState) {
        emptyState.remove();
        emptyState = null;
      }
      emptyState = null;
      conversationHistory.forEach(entry => {
        const role = entry.role === "model" ? "ai" : "user";
        const text = entry.parts[0].text;
        renderMessage(role, text, false); // false = no save (already saved)
      });
    }

    // ── Textarea auto-resize ──────────────────────────────────────────
    userInput.addEventListener("input", () => {
      userInput.style.height = "auto";
      userInput.style.height = Math.min(userInput.scrollHeight, 140) + "px";
    });

    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function sendSuggestion(btn) {
      userInput.value = btn.textContent;
      sendMessage();
    }

    // ── Render a message bubble ───────────────────────────────────────
    function renderMessage(role, text, animate = true) {
      const messageId = messageIdCounter++;
      if (emptyState) { emptyState.remove(); emptyState = null; }

      const msg = document.createElement("div");
      msg.className = `msg ${role}`;
      msg.dataset.id = messageId;
      if (!animate) msg.style.animation = "none";

      const label = document.createElement("div");
      label.className = "msg-label";
      label.textContent = role === "user" ? "you" : "ai";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (role === "ai") {
        bubble.innerHTML = marked.parse(text);
      } else {
        bubble.textContent = text;
      }

      msg.appendChild(label);
      msg.appendChild(bubble);

      // Action buttons (copy + regenerate for AI, copy for user)
      const actions = document.createElement("div");
      actions.className = "msg-actions";

      const copyBtn = makeActionBtn("📋 copy", () => copyText(bubble, copyBtn, text));
      actions.appendChild(copyBtn);

      if (role === "ai") {
        const regenBtn = makeActionBtn("↺ regenerate", () => regenerate(msg));
        actions.appendChild(regenBtn);
      }

      msg.appendChild(actions);
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return bubble;
    }

    function makeActionBtn(label, onClick) {
      const btn = document.createElement("button");
      btn.className = "action-btn";
      btn.textContent = label;
      btn.onclick = onClick;
      return btn;
    }

    // ── Copy to clipboard ─────────────────────────────────────────────
    async function copyText(bubble, btn, rawText) {

      try {
        await navigator.clipboard.writeText(rawText);
        btn.textContent = "✓ copied";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = "📋 copy";
          btn.classList.remove("copied");
        }, 2000);
      } catch {
        btn.textContent = "failed";
      }
    }

    async function regenerate(aiMsgEl) {
      const allMsgs = [...chatContainer.querySelectorAll(".msg")];
      const idx = allMsgs.indexOf(aiMsgEl);

      aiMsgEl.remove();

      const histIdx = conversationHistory.findLastIndex(e => e.role === "model");
      if (histIdx !== -1) {
        conversationHistory = conversationHistory.slice(0, histIdx);
      }

      if (memoryEnabled) saveHistory();

      sendBtn.disabled = true;
      showTyping("ai");

      try {
        const payload = conversationHistory.length
          ? { contents: conversationHistory }
          : { contents: [{ role: "user", parts: [{ text }] }] };

        const reply = await fetchWithRetry(payload);

        if (memoryEnabled) {
          conversationHistory.push({ role: "model", parts: [{ text: reply }] });
          trimHistory();
          saveHistory();
        }

        removeTyping();
        renderMessage("ai", reply);

      } catch (err) {
        removeTyping();
        renderMessage("ai", "⚠ " + err.message);
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }
    // ── Typing indicator ──────────────────────────────────────────────
    function showTyping(statusText = "ai") {
      removeTyping();
      const msg = document.createElement("div");
      msg.className = "msg ai";
      msg.id = "typing";

      const label = document.createElement("div");
      label.className = "msg-label";
      label.id = "typing-label";
      label.textContent = statusText;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;

      msg.appendChild(label);
      msg.appendChild(bubble);
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTyping() {
      document.getElementById("typing")?.remove();
    }

    function setTypingStatus(text) {
      const label = document.getElementById("typing-label");
      if (label) label.textContent = text;
    }

    // ── Fetch with retry (503/429 backoff) ────────────────────────────
    async function fetchWithRetry(body, retries = 4) {
      if (!body.contents || body.contents.length === 0) {
        throw new Error("No conversation history sent to model.");
      }

      for (let attempt = 0; attempt < retries; attempt++) {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        const data = await response.json();

        if (data.error?.code === 503 || data.error?.code === 429) {
          if (attempt < retries - 1) {
            const delay = 1500 * Math.pow(2, attempt);
            setTypingStatus(`retrying in ${Math.round(delay / 1000)}s…`);
            await new Promise(res => setTimeout(res, delay));
            setTypingStatus("ai");
            continue;
          }
          throw new Error("Model is overloaded. Please try again in a moment.");
        }

        if (data.error) throw new Error(data.error.message || "API error");

        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!reply) throw new Error("Empty response from model.");
        return reply;
      }
    }

    // ── Send message ──────────────────────────────────────────────────
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      userInput.value = "";
      userInput.style.height = "auto";
      sendBtn.disabled = true;

      renderMessage("user", text);

      if (memoryEnabled) {
        conversationHistory.push({ role: "user", parts: [{ text }] });
        trimHistory();
        saveHistory();
      }

      showTyping("ai");

      try {
        const payload = memoryEnabled
          ? { contents: conversationHistory }
          : {
            contents: [
              {
                role: "user",
                parts: [{ text }]
              }
            ]
          };

        const reply = await fetchWithRetry(payload);
        if (memoryEnabled) {
          conversationHistory.push({ role: "model", parts: [{ text: reply }] });
          trimHistory();
          saveHistory();
        }
        removeTyping();
        renderMessage("ai", reply);
      } catch (err) {
        removeTyping();
        renderMessage("ai", "⚠ " + err.message);
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    // ── Clear chat ────────────────────────────────────────────────────
    let toastTimeout;

    function promptClear() {
      const toast = document.getElementById("toast");
      toast.classList.add("show");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(hideToast, 5000);
    }

    function hideToast() {
      document.getElementById("toast").classList.remove("show");
    }

    function toggleMemory() {
      memoryEnabled = !memoryEnabled;

      localStorage.setItem("memoryEnabled", memoryEnabled);

      const btn = document.getElementById("memory-toggle");

      if (memoryEnabled) {
        btn.textContent = "Memory: ON";
        btn.classList.add("active");
      } else {
        btn.textContent = "Memory: OFF";
        btn.classList.remove("active");

        conversationHistory = [];
        localStorage.removeItem(STORAGE_KEY);
      }
    }
    function clearChat() {
      hideToast();
      conversationHistory = [];
      localStorage.removeItem(STORAGE_KEY);
      chatContainer.innerHTML = "";

      // Restore empty state
      const es = document.createElement("div");
      es.className = "empty-state";
      es.id = "empty-state";
      es.innerHTML = `
        <div class="empty-icon">✦</div>
        <h2>How can I help you?</h2>
        <p>Ask me anything.</p>
        <div class="suggestions">
          <button class="suggestion-chip" onclick="sendSuggestion(this)">Explain quantum computing</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">Write a short poem</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">Help me brainstorm ideas</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">Teach me the ways to prompt correctly</button>
        </div>`;
      chatContainer.appendChild(es);
      if (emptyState) {
        emptyState.remove();
      }
      emptyState = es;
    }
  </script>
</body>

</html>
