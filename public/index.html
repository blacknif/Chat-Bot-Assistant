<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova</title>
  <link rel="icon" type="image/png" href="https://img.icons8.com/emoji/96/eight-pointed-star-emoji.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>

<body>

  <canvas id="bg-canvas"></canvas>

  <header>
    <div class="logo-dot">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="nova-h" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#c4b5fd"/>
            <stop offset="100%" stop-color="#6d5ef5"/>
          </linearGradient>
          <filter id="glow-h">
            <feGaussianBlur stdDeviation="1.2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path filter="url(#glow-h)" fill="url(#nova-h)"
          d="M14 1.5 L16.3 11.7 L26.5 14 L16.3 16.3 L14 26.5 L11.7 16.3 L1.5 14 L11.7 11.7 Z"/>
        <circle cx="14" cy="14" r="2.2" fill="white" opacity="0.55"/>
      </svg>
    </div>
    <h1>Nova</h1>
    <span class="author-badge">Made by Jovan Yeo Kaisheng</span>
    <button id="memory-toggle" onclick="toggleMemory()">Memory: ON</button>
    <button id="clear-btn" onclick="promptClear()" title="Clear chat">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6" />
        <path d="M19 6l-1 14H6L5 6" />
        <path d="M10 11v6" />
        <path d="M14 11v6" />
        <path d="M9 6V4h6v2" />
      </svg>
      Clear
    </button>
  </header>

  <div id="toast">
    Clear all messages?
    <button onclick="clearChat()">Yes, clear</button>
    <button class="cancel-toast" onclick="hideToast()">Cancel</button>
  </div>

  <button id="scroll-btn" aria-label="Scroll to bottom">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>

  <div id="chat-container">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">
        <svg width="36" height="36" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="nova-e" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#c4b5fd"/>
              <stop offset="100%" stop-color="#6d5ef5"/>
            </linearGradient>
            <filter id="glow-e">
              <feGaussianBlur stdDeviation="2" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <path filter="url(#glow-e)" fill="url(#nova-e)"
            d="M28 3 L32.5 23.5 L53 28 L32.5 32.5 L28 53 L23.5 32.5 L3 28 L23.5 23.5 Z"/>
          <circle cx="28" cy="28" r="4.5" fill="white" opacity="0.5"/>
        </svg>
      </div>
      <h2>How can I help you?</h2>
      <p>I'm Nova, your friendly AI assistant. Ask me anything!</p>
      <div class="suggestions">
        <button class="suggestion-chip" onclick="sendSuggestion(this)">Explain quantum computing</button>
        <button class="suggestion-chip" onclick="sendSuggestion(this)">Write a short poem</button>
        <button class="suggestion-chip" onclick="sendSuggestion(this)">Help me brainstorm ideas</button>
        <button class="suggestion-chip" onclick="sendSuggestion(this)">Teach me the ways to prompt correctly</button>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="user-input" placeholder="Message AI..." rows="1"></textarea>
      <button id="send-btn" onclick="sendMessage()" aria-label="Send">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
        </svg>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="main.js"></script>

</body>
</html>
